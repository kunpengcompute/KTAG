onnx_log_level: WARNING
# The active paths above are historical 354-column CSVs, so they keep the
# historical [0, 1, 2] removal contract. Newly generated 366-column Schema
# CSVs retain 12 meta.* columns and require [0..14] for application training;
# do not change this value until training_data_paths/evaluation_data_paths are
# replaced together. Training/evaluation now remove these columns in memory.
columns_to_remove: []
filter_packets: 16

# New stage-7 orchestration is opt-in. With no pipeline CLI option this false
# value preserves online_inference_mode and the existing model configuration.
# Passing --pipeline-mode forces this block on for that invocation only.
pipeline:
  enabled: false
  mode: feature_parallel
  # When the schema selection below is the complete Legacy V1 contract,
  # `kdadk_demo -t` automatically creates this Schema-bound model package
  # after writing the legacy ONNX/scaler files.
  model_package_path: ../../result/legacy_model_package
  # Online -c/-j output retains numeric label/confidence and explicit IPv4/IPv6
  # flow metadata. confidence=0 is valid; -1 means probability unavailable.

  capture:
    packet_pool_size: 65536

  feature:
    threads: 4
    queue_capacity: 65536
    flow_hash_seed: 2026
    # legacy makes all four new pipeline topologies reproduce the historical
    # fixed-vector flow lifecycle used by the existing training data/model.
    lifecycle_mode: legacy
    expire_interval_ms: 1000

  inference:
    threads: 1
    batch_size: 256
    queue_capacity: 4096
    intra_op_threads: 1
    inter_op_threads: 1

  backpressure:
    policy: block

  plugins: []
  schema:
    # Official application contract: 53 Feature Descriptors / 354 values,
    # Hash 0xdd48882b53bebfa5. Do not reuse this name for custom selections.
    name: ktag_legacy_v1
    version: 1
    remove_features: []
    add_features: []

  # The complete official proxy training/evaluation/inference configuration is
  # proxy_config.yaml. It uses this same YAML structure and parser.
