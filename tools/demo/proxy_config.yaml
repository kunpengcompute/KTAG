# ktag_proxy_v1 configuration for Schema CSV extraction, training, evaluation
# and online inference. The active outer groups define the numeric labels; the
# current file is a two-class incremental training example. Extend it to the
# formal 13-class target as data becomes available, keeping train/evaluation
# group order aligned. IPv4-only, IPv6-only and mixed groups are all valid;
# missing-family coverage emits a warning instead of blocking training.

