  # label 0: VMess / WebSocket / TLS
  - [
      /data2/proxy_data/class-05-vmess-websocket-tls/sample-01.csv,
      /data2/proxy_data/class-05-vmess-websocket-tls/sample-02.csv,
      /data2/proxy_data/class-05-vmess-websocket-tls/sample-03.csv,
      /data2/proxy_data/class-05-vmess-websocket-tls/sample-04.csv,
    ]
  # label 1: VMess / XHTTP(H2) / TLS
  - [
      /data2/proxy_data/class-06-vmess-xhttp-h2-tls/sample-01.csv,
      /data2/proxy_data/class-06-vmess-xhttp-h2-tls/sample-02.csv,
      /data2/proxy_data/class-06-vmess-xhttp-h2-tls/sample-03.csv,
